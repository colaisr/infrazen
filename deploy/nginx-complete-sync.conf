# Add these location blocks BEFORE the generic "location /" in your nginx site config.
# Place inside the server { } block (e.g. /etc/nginx/sites-available/infrazen).
#
# Sync endpoints can exceed default nginx timeout (~60s), causing 504 and "Unexpected token '<'" in UI.
#
# After editing: sudo nginx -t && sudo systemctl reload nginx

    # Complete sync (bulk): 5-10+ min for Cloud.ru 600+ resources
    location /api/complete-sync {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Single provider sync (Cloud.ru 600+ resources ~1 min)
    location ~ ^/api/providers/cloud-ru/[0-9]+/sync$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }
