# Add this location block BEFORE the generic "location /" in your nginx site config.
# Place it inside the server { } block (e.g. /etc/nginx/sites-available/infrazen).
#
# Complete sync can take 5-10+ minutes (Cloud.ru 600+ resources + recommendations).
# Default nginx timeout (~60s) causes 504. This gives 10 minutes.
#
# After editing: sudo nginx -t && sudo systemctl reload nginx

    location /api/complete-sync {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
    }
